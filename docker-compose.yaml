services:
  comfy:
    working_dir: /home/ubuntu/comfyui
    command: uv run main.py --listen --reserve-vram 1.5 --port 8188 --enable-manager
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8188/"]
      interval: 30s
      timeout: 10s
      retries: 3
    build:
      dockerfile: comfy.Dockerfile
      args:
       COMFY_VERSION: "v0.34.0"
       USERID: "${UID}"
       GROUPID: "${GID}"
    ports:
      - 8188:8188
    volumes:
      - ${INPUT_DIR}:/home/ubuntu/comfyui/input
      - ${OUTPUT_DIR}:/home/ubuntu/comfyui/output
      - ${MODEL_DIR}:/home/ubuntu/comfyui/models
      - ./workflows:/home/ubuntu/comfyui/user/default/workflows
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    ipc: host
    group_add:
      - video
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    environment:
      - WEBUI_AUTH=false
    volumes:
      - open-webui:/app/backend/data
    models:
      gemma:
        # this sets the Open WebUI envvars to use the gemma model and the model runner URL
        endpoint_var: OPENAI_API_BASE_URL
        model_var: DEFAULT_MODELS

models:
  gemma:
    model: docker.io/local/gemma:E4B-Q4_k_m
    context_size: 32768


networks: # Define a custom network
  internal_network:
    driver: bridge

volumes:
  open-webui:
