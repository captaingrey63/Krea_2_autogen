services:
  comfy:
    working_dir: /home/ubuntu/comfyui
    command: python main.py --listen --reserve-vram 1.5 --port 8188
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8188/"]
      interval: 30s
      timeout: 10s
      retries: 3
    build:
      dockerfile: comfy.Dockerfile
      args:
       COMFY_VERSION: "v0.34.0"
       USERID: "${UID}"
       GROUPID: "${GID}"
    ports:
      - 8188:8188
    volumes:
      - ./input:/home/ubuntu/comfyui/input
      - comfy-output:/home/ubuntu/comfyui/output
      - ${MODEL_DIR}:/home/ubuntu/comfyui/models
      - ./workflows:/home/ubuntu/comfyui/user/default/workflows
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    ipc: host
    group_add:
      - video
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://172.17.0.1:12434
      - WEBUI_AUTH=false
    volumes:
      - open-webui:/app/backend/data
    
networks: # Define a custom network
  internal_network:
    driver: bridge

volumes:
  open-webui:
  comfy-output: