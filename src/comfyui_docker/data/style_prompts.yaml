Renaissance Oil Painting:
  description: |
    Classic Renaissance style with rich, warm color palettes, chiaroscuro lighting,
    and intricate detailing. Features soft, atmospheric backgrounds with deep shadows
    and luminous highlights.

Victorian Portrait:
  description: |
    Elegant Victorian era style with elaborate clothing, detailed textures, and
    refined compositions. Uses sophisticated color schemes with rich fabrics
    and ornate accessories.

Anime:
  description: |
    Japanese animation style with bold outlines, vibrant colors, and expressive
    character designs. Features large, sparkling eyes, colorful hair, and dynamic
    posing.

Cyberpunk:
  description: |
    Futuristic style with neon lighting, dark backgrounds, and high-tech elements.
    Features glowing accents, cybernetic enhancements, and a moody, atmospheric
    color palette with purples, blues, and pinks.

Watercolor:
  description: |
    Soft, translucent watercolor style with flowing colors, subtle texture, and
    gentle blending. Features a dreamy, ethereal quality with visible brush strokes
    and color bleeding effects.

Photorealistic:
  description: |
    Hyper-realistic style that mimics high-resolution photography. Features
    accurate lighting, realistic textures, and lifelike details with natural
    color grading.

Fantasy Art:
  description: |
    Magical and imaginative style with vibrant colors, mystical creatures, and
    enchanting landscapes. Features glowing effects, magical auras, and
    otherworldly compositions.

Noir:
  description: |
    Black and white or high-contrast style with dramatic lighting and deep shadows.
    Features a moody, mysterious atmosphere with strong emphasis on light and dark
    contrast.

1990s Anime:
  description: |
    Classic 1990s Japanese animation style with cel-shaded colors, bold character
    designs, and iconic visual storytelling. Features vibrant yet slightly muted
    color palettes, clean linework, and expressive characters.

2000s Anime:
  description: |
    Early 2000s anime aesthetic with digital coloring, smoother animation, and
    more detailed backgrounds. Features a blend of traditional and digital art
    styles with dynamic camera angles and modern character designs.

Western Cartoon:
  description: |
    Traditional Western animation style with bold, simple lines, and flat colors.
    Features rubber-hose animation principles, exaggerated expressions, and
    vibrant, primary color schemes reminiscent of classic cartoons.

Sci-Fi Illustration:
  description: |
    Futuristic and technological style with sleek spaceships, alien landscapes,
    and advanced machinery. Features metallic surfaces, glowing energy effects,
    and a cool, high-tech color palette with blues, silvers, and neon accents.

Cubist Painting:
  description: |
    Abstract cubist style with geometric shapes, fractured forms, and multiple
    perspectives. Features angular compositions, muted earth tones, and a focus
    on deconstructing subjects into cubic elements.

Impressionist Painting:
  description: |
    Soft, brush-stroke heavy style with visible texture and blended colors.
    Features light, airy compositions with dappled lighting and a focus on
    capturing the impression of a moment rather than precise details.

Communist Propaganda Poster:
  description: |
    Bold, graphic style with strong symbols, striking colors, and ideological
    messaging. Features simplified figures, bold typography, and a limited
    color palette with high contrast and strong reds, yellows, and blacks.

Afrofuturist Illustration:
  description: |
    Futuristic style celebrating African culture with traditional patterns
    fused with sci-fi elements. Features rich, warm colors, geometric designs,
    and a blend of heritage and technological advancement.

Monochromatic Renaissance Sketch:
  description: |
    Detailed pencil or ink sketch style inspired by Renaissance masters.
    Features intricate linework, cross-hatching, and a focus on form and
    anatomy with a single-color palette.

Dutch Master Oil Painting:
  description: |
    Rich, detailed style of 17th century Dutch painters with masterful
    use of light and shadow. Features dark backgrounds, luminous highlights,
    intricate textures, and a focus on still life and portraiture.
