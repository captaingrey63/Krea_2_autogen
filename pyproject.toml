[project]
name = "comfyui-docker"
version = "0.1.0"
description = "Project to use an LLM running in Docker Model Runner to make a prompt to generate images in ComfyUI"
readme = "README.md"
authors = [
    { name = "Cecil Grey", email = "captaingrey63@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "comfy-cli>=1.20.0",
    "llama-index-workflows==2.26.0",
    "docker>=7.2.0",
    "openai>=3.13.0",
    "opencv-python-headless"
]

[project.scripts]
gen_from_llm = "comfyui_docker.gen_from_llm:main"
gen_from_llm_workflows = "comfyui_docker.gen_from_llm_workflows:main"
image_gen_workflow = "comfyui_docker.image_gen_workflow:main"
[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
